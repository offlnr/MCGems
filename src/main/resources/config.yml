# Configuración del sistema de Gemas.
#
# Los campos "nombre" y "lore" soportan el formato MiniMessage de Adventure
# (ya incluido con Paper, no hace falta ningún plugin extra):
#   - Colores por nombre:  <red>, <gold>, <light_purple>, <gray>, etc.
#   - Colores hex/rgb:     <#ff8800>  o  <color:#ff8800>
#   - Estilos:             <bold>, <italic>, <underlined>, <strikethrough>
#   - Se pueden combinar y anidar, ej: "<#55aaff><bold>Azada de Gemas</bold></#55aaff>"
# Por defecto todo el texto sale sin cursiva; si querés cursiva, agregala
# explícitamente con <italic>.

azada:
  # Segundos que tarda en romper una gema. Se recalcula sola la velocidad
  # real de minado (no hace falta tocar nada más).
  tiempo-minado-segundos: 30
  nombre: "<gradient:#7843ff:#d5c7fa><shadow:#4800ff><underlined><bold>Azada de Gemas</bold></underlined></shadow></gradient>"
  lore:
    - "<gray>Única herramienta capaz de extraer</gray>"
    - "<gray>gemas cristalizadas.</gray>"

# Minas creadas con /gema llenar.
minas:
  # Segundos de espera, luego de agotarse la última gema de una mina, antes
  # de que se regenere entera de nuevo.
  regeneracion-segundos: 10

# Se aplican por igual a los 7 colores de cabeza.
cabezas-opciones:
  stack-maximo: 64
  brillo: true

# Una entrada por color de gema. "textura" es la URL de la cabeza (serie
# "Zero Gem" de minecraft-heads.com); "nombre" y "lore" son lo que se ve en
# el ítem al dropearse. Cambiar nombre/lore NO afecta la textura.
cabezas:
  blue:
    textura: "http://textures.minecraft.net/texture/150649626c4101352c5995c53b48bff60a938212b7ce902415feb76ea273b35f"
