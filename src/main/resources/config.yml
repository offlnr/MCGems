# Configuración del sistema de Gemas.
# "nombre" y "lore" usan formato MiniMessage: colores (<red>, <#ff8800>) y
# estilos (<bold>, <italic>, <underlined>). Sin cursiva por defecto.

# Función: herramienta especial para extraer gemas.
azada:
  # Segundos que tarda en romper una gema.
  tiempo-minado-segundos: 60
  nombre: "<#FFFFFF><sprite:'minecraft:items':item/nether_star> <gradient:#FF00C3:#FF9D00><shadow:#9400FF:0.2><underlined><bold>Extractor de gemas</bold></underlined></shadow></gradient> <sprite:'minecraft:items':item/nether_star>"
  lore:
    - "<#FF7AEE>Única herramienta capaz de extraer"
    - "<#FF7AEE>gemas cristalizadas."

# Función: pico entregado con /gema picota. "encantamientos" es libre: se
# puede agregar, quitar o cambiar el nivel de cualquier encantamiento vanilla
# (clave en inglés, ej. "efficiency", "fortune") sin límite de nivel.
picota:
  nombre: '<#bdbdbd><sprite:"minecraft:particles":gust_7> <gradient:#525251:#bababa><shadow:#303030:0.9><underlined><bold>Picota Cristalizada</bold></underlined></shadow></gradient> <sprite:"minecraft:particles":gust_7>'
  lore:
    - "<#FF7AEE>Forjada concentrando la energía"
    - "<#FF7AEE>de innumerables gemas cristalizadas."
  encantamientos:
    efficiency: 10
    fortune: 5
    mending: 10
    unbreaking: 10

# Función: armadura entregada con /gema armadura. "encantamientos" es libre
# por pieza: se puede agregar, quitar o cambiar el nivel de cualquier
# encantamiento vanilla (clave en inglés) sin límite de nivel.
armadura:
  casco:
    nombre: '<#FF00DD><sprite:"minecraft:particles":spark_7> <gradient:#E9FF00:#FF00DD><shadow:#6E056D:0.7><underlined><bold>Casco Cristalizado</bold></underlined></shadow></gradient> <sprite:"minecraft:particles":spark_7>'
    lore:
      - "<#FF7AEE>Forjada concentrando la energía"
      - "<#FF7AEE>de innumerables gemas cristalizadas."
    encantamientos:
      protection: 7
      blast_protection: 7
      projectile_protection: 7
      fire_protection: 7
      respiration: 10
      aqua_affinity: 10
      mending: 10
      unbreaking: 10
  pechera:
    nombre: '<#FF00DD><sprite:"minecraft:particles":spark_7> <gradient:#E9FF00:#FF00DD><shadow:#6E056D:0.7><underlined><bold>Pechera Cristalizada</bold></underlined></shadow></gradient> <sprite:"minecraft:particles":spark_7>'
    lore:
      - "<#FF7AEE>Forjada concentrando la energía"
      - "<#FF7AEE>de innumerables gemas cristalizadas."
    encantamientos:
      protection: 7
      blast_protection: 7
      projectile_protection: 7
      fire_protection: 7
      mending: 10
      unbreaking: 10
  pantalones:
    nombre: '<#FF00DD><sprite:"minecraft:particles":spark_7> <gradient:#E9FF00:#FF00DD><shadow:#6E056D:0.7><underlined><bold>Pantalones Cristalizados</bold></underlined></shadow></gradient> <sprite:"minecraft:particles":spark_7>'
    lore:
      - "<#FF7AEE>Forjada concentrando la energía"
      - "<#FF7AEE>de innumerables gemas cristalizadas."
    encantamientos:
      protection: 7
      blast_protection: 7
      projectile_protection: 7
      fire_protection: 7
      swift_sneak: 5
      mending: 10
      unbreaking: 10
  botas:
    nombre: '<#FF00DD><sprite:"minecraft:particles":spark_7> <gradient:#E9FF00:#FF00DD><shadow:#6E056D:0.7><underlined><bold>Botas Cristalizadas</bold></underlined></shadow></gradient> <sprite:"minecraft:particles":spark_7>'
    lore:
      - "<#FF7AEE>Forjada concentrando la energía"
      - "<#FF7AEE>de innumerables gemas cristalizadas."
    encantamientos:
      protection: 7
      blast_protection: 7
      projectile_protection: 7
      fire_protection: 7
      depth_strider: 7
      feather_falling: 7
      soul_speed: 10
      mending: 10
      unbreaking: 10

# Función: minas creadas con /gema crearmina.
minas:
  # Segundos hasta que se regenera una mina agotada.
  regeneracion-segundos: 10

# Función: tamaño de stack y brillo de las 7 cabezas de gema.
cabezas-opciones:
  stack-maximo: 64
  brillo: true

