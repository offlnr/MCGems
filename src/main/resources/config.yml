# Configuración general del sistema de Gemas. Los ítems (azada, picota,
# abysmal, armadura y los personalizados) se mudaron a items.yml, editable
# también desde el juego con /gema editar.
# "nombre" y "lore" usan formato MiniMessage: colores (<red>, <#ff8800>) y
# estilos (<bold>, <italic>, <underlined>). Sin cursiva por defecto.

# Función: minas creadas con /gema crearmina.
minas:
  # Segundos hasta que se regenera una mina agotada.
  regeneracion-segundos: 10

# Función: tamaño de stack y brillo de las 6 cabezas de gema.
cabezas-opciones:
  stack-maximo: 64
  brillo: true

# Función: nombre, lore y textura de cada cabeza de gema.
cabezas:
  celeste:
    textura: "http://textures.minecraft.net/texture/d59e3dbfc1d1ea9533011a0e0a4a5f1827fc6becd7f2d8c82b63ba7ecb814901"
    nombre: "<gradient:#01c5e3:#84efff><shadow:#006e80><bold>Gema Celeste</bold></shadow></gradient>"
    lore:
      - "<#FF7AEE>Puedes intercambiar items"
      - "<#FF7AEE>especiales con ella"
